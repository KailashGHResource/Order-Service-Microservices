# App Name (Matches the prefix of the files in the Config Server)
spring.application.name=api-gateway

# Active Profile (Change to 'test' when you want to load the test properties)
spring.profiles.active=dev

# Config Server Location
spring.config.import=optional:configserver:http://localhost:8888

eureka.instance.prefer-ip-address=true

# Force Eureka to ignore Docker/WSL virtual networks and use localhost strictly
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# --- ACTUATOR & TRACING ---
management.endpoints.web.exposure.include=health,metrics
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Include Trace ID and Span ID in Gateway console logs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

spring.cloud.gateway.discovery.locator.enabled=true