# App Name (Matches the prefix of the files in the Config Server)
spring.application.name=api-gateway

# Active Profile (Change to 'test' when you want to load the test properties)
spring.profiles.active=dev

# Config Server Location
spring.config.import=optional:configserver:http://localhost:8888

eureka.instance.prefer-ip-address=true

# Force Eureka to ignore Docker/WSL virtual networks and use localhost strictly
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# 1. Gateway Server Config
server.port=8080

# 2. Eureka Connection
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# 3. Turn OFF the auto-locator
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# 4. EXPLICIT ROUTE: Department Service
spring.cloud.gateway.server.webflux.routes[0].id=department-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/department-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# 5. EXPLICIT ROUTE: Employee Service
spring.cloud.gateway.server.webflux.routes[1].id=employee-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# 6. EXPLICIT ROUTE: Leave Service
spring.cloud.gateway.server.webflux.routes[2].id=leave-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://LEAVE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/leave-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# 7. EXPLICIT ROUTE: Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# 8. EXPLICIT ROUTE: Audit Service (Added)
spring.cloud.gateway.server.webflux.routes[4].id=audit-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUDIT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/audit-service/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

# --- DAY 3: DISTRIBUTED TRACING (MICROMETER + ZIPKIN) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Add Trace ID and Span ID to your console logs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- ACTUATOR & GATEWAY METRICS ---
management.endpoints.web.exposure.include=health,metrics,gateway
management.endpoint.health.show-details=always