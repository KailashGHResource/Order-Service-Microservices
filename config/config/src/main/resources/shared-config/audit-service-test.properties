# Use a random port for integration tests to avoid conflicts
server.port=0
spring.application.name=audit-service

# Config Server (Disable for tests to prevent hanging if needed, or keep it enabled if your test suite pulls from it)
spring.cloud.config.enabled=false

# Test Database Configuration (Matched to your admin credentials and test database)
spring.datasource.url=jdbc:postgresql://localhost:5432/audit_db_test
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Eureka Client & RestClient Fixes
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false
eureka.client.restclient.enabled=true

# Disable Eureka registration during local testing
eureka.client.enabled=false

# Testing Logging Profile
logging.level.root=WARN
logging.level.com.example=INFO

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0