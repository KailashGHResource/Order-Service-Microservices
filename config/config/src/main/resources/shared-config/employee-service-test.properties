# Use a random port for integration tests to avoid conflicts
server.port=0

# Test Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db_test
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Eureka Client & RestClient Fixes (Ensures test context doesn't trigger Jersey errors)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false
eureka.client.restclient.enabled=true

# Mock URLs for testing (used with WireMock)
services.department.url=http://localhost:9082
services.leave.url=http://localhost:9083
services.notification.url=http://localhost:9084

# Testing Logging Profile
logging.level.root=WARN
logging.level.com.example=INFO

# --- DAY 2: RESILIENCE & FAULT TOLERANCE (FAST FAIL FOR TESTING) ---
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.configs.default.register-health-indicator=true
# Smaller window so the circuit opens faster during tests
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
# Short wait duration so tests don't hang
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=1s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=1

# Disable retries or make them extremely fast for testing
resilience4j.retry.configs.default.max-attempts=1
resilience4j.retry.configs.default.wait-duration=100ms

# Short timeout so Wiremock delay tests fail quickly
resilience4j.timelimiter.configs.default.timeout-duration=1s

# Fast Rate Limiter for Integration Tests
resilience4j.ratelimiter.configs.default.limit-for-period=2
resilience4j.ratelimiter.configs.default.limit-refresh-period=10s
resilience4j.ratelimiter.configs.default.timeout-duration=0s

# --- DAY 3: REDIS CACHE STRATEGY ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000