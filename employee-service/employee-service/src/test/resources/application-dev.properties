server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client & RestClient Fixes
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.jersey.enabled=false
eureka.client.restclient.enabled=true

# URLs for Feign Clients
services.department.url=http://localhost:8082
services.leave.url=http://localhost:8083
services.notification.url=http://localhost:8084

# Improved Logging
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# --- RESILIENCE4J INSTANCE CONFIGURATIONS ---
spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.employeeServiceCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.employeeServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.employeeServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.employeeServiceCB.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.employeeServiceCB.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.employeeServiceCB.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.employeeServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.employeeServiceCB.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.employeeServiceRetry.max-attempts=3
resilience4j.retry.instances.employeeServiceRetry.wait-duration=2s

resilience4j.timelimiter.instances.employeeServiceCB.timeout-duration=3s

# --- RATE LIMITING ---
resilience4j.ratelimiter.configs.default.limit-for-period=5
resilience4j.ratelimiter.configs.default.limit-refresh-period=10s
resilience4j.ratelimiter.configs.default.timeout-duration=0s

# --- ACTUATOR & METRICS ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# --- DISTRIBUTED TRACING (MICROMETER + ZIPKIN) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# --- REDIS CACHE STRATEGY ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000