server:
  port: 8086

spring:
  application:
    name: order-service

  # --- PostgreSQL Database Configuration ---
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false # 🔥 FIXED: Set to false to remove console spam
    properties:
      hibernate:
        format_sql: false # 🔥 FIXED: Set to false to remove console spam

  # --- Redis & Cache Configuration ---
  # 🔥 FIXED: Moved this block out of 'eureka' and into 'spring' where it belongs!
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000 # Cache expires after 10 minutes (in milliseconds)
      cache-null-values: false

# --- Downstream Service URLs ---
application:
  config:
    customer-url: http://localhost:8081
    product-url: http://localhost:8082
    inventory-url: http://localhost:8083

# --- Resilience4j Configuration ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      inventory:
        base-config: default
      customer:
        base-config: default
      product:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
    instances:
      inventory:
        base-config: default
      customer:
        base-config: default
      product:
        base-config: default

# ===============================
# ACTUATOR & METRICS (PROMETHEUS)
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

  # ===============================
  # DISTRIBUTED TRACING (ZIPKIN)
  # ===============================
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Automatically add Trace ID and Span ID to your console log outputs!
logging:
  pattern:
    level: "%5p [${spring.application.name:}, Trace:%X{traceId:-}, CorrID:%X{correlationId:-}]"

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers: localhost:9092
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id: order-group
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages: "*"

# ===============================
# EUREKA DISCOVERY CONFIGURATION
# ===============================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true